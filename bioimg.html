<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BioImg – Éditeur de figures scientifiques</title>
  <link rel="stylesheet" href="bioimg.css" />
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
</head>
<body>
  <header class="toolbar">
    <h1>🧬 BioImg</h1>
    <div class="group">
      <button id="btnText">T Texte</button>
    </div>
    <div class="group">
      <button id="btnFront">⬆ Avant</button>
      <button id="btnBack">⬇ Arrière</button>
      <button id="btnDelete" class="danger" title="Suppr">🗑</button>
    </div>
    <div class="group">
      <button id="btnNew">Nouveau</button>
      <button id="btnSave">💾 Projet</button>
      <label class="btn">📂 Ouvrir<input type="file" id="fileProject" accept=".json" hidden /></label>
      <button id="btnPng" class="primary">Exporter PNG</button>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <input id="search" type="search" placeholder="Rechercher une icône..." />
      <label class="btn upload">➕ Importer SVG/PNG
        <input type="file" id="fileIcon" accept=".svg,.png,.jpg" multiple hidden />
      </label>
      <div id="iconList" class="icon-list"></div>
    </aside>

    <section id="canvasWrap"><div id="canvas"></div></section>

    <aside class="props" id="props">
      <h3>Propriétés</h3>
      <p class="hint" id="noSel">Sélectionne un élément</p>
      <div id="propFields" hidden>
        <label id="colorWrap">Couleur <input type="color" id="propColor" /></label>
        <label id="fsWrap">Taille texte <input type="number" id="propFont" min="6" max="200" /></label>
        <div id="dimWrap">
          <div class="row">
            <label>Largeur <input type="number" id="propW" min="10" max="4000" /></label>
            <label>Hauteur <input type="number" id="propH" min="10" max="4000" /></label>
          </div>
          <label class="checkbox-label"><input type="checkbox" id="propRatio" checked /> Conserver les proportions</label>
        </div>
        <div id="rotWrap">
          <label>Rotation (°) <input type="number" id="propRot" min="-360" max="360" /></label>
          <div class="btn-group">
            <button type="button" id="btnRotLeft" title="Pivoter à gauche de 90°">⟲ -90°</button>
            <button type="button" id="btnRotRight" title="Pivoter à droite de 90°">⟳ +90°</button>
            <button type="button" id="btnFlipH" title="Retourner horizontalement">⇄ Miroir H</button>
            <button type="button" id="btnFlipV" title="Retourner verticalement">⇅ Miroir V</button>
          </div>
        </div>
        <label>Opacité <input type="range" id="propOpacity" min="0.1" max="1" step="0.05" /></label>
        <p class="hint" id="textHint">Double-clic sur un texte pour le modifier</p>
      </div>
      <hr />
      <label>Largeur page <input type="number" id="pageW" value="1200" /></label>
      <label>Hauteur page <input type="number" id="pageH" value="800" /></label>
      <hr />
      <h3>Raccourcis</h3>
      <p class="hint">
        Ctrl+C / Ctrl+V : copier / coller<br />
        Ctrl+X : couper<br />
        Ctrl+Z / Ctrl+Y : annuler / rétablir<br />
        Suppr : supprimer<br />
        Flèches : déplacer (Maj = ×10)<br />
        Maj + poignée : déformer<br />
        Échap : désélectionner
      </p>
    </aside>
  </main>

  <script src="bioimg-icons.js"></script>
  <script src="bioimg.js"></script>
</body>
</html>
